function fmtTime(iso){ const d=new Date(iso); return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'}); }
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString([], {month:'short', day:'numeric'}); }
function fmtDateTime(iso){ const d=new Date(iso); return d.toLocaleDateString([], {month:'short', day:'numeric'}) + ' · ' + fmtTime(iso); }

function fmtDurSec(h){ const s=Math.max(0, Math.round(h*3600)); return `${Math.floor(s/3600)}h ${pad(Math.floor(s/60)%60)}m ${pad(s%60)}s`; }

function toISODate(v){
  if(v==null || v==='') return null;
  if(v instanceof Date && !isNaN(v)) return v.getFullYear()+'-'+pad(v.getMonth()+1)+'-'+pad(v.getDate());
  const s = String(v).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const d = new Date(s);
  return isNaN(d) ? null : d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}

// Only recent clock records travel with the main payload; older history is
// reached through the Time Log's date filter, and hour totals are summed by
// the database (employee_hours) rather than downloaded row by row.
const LOG_WINDOW_DAYS = 45;
const logCutoff = () => new Date(Date.now() - LOG_WINDOW_DAYS*86400000).toISOString();

async function fetchAll(){
  const [emp, cli, prj, tsk, shf, lg] = await Promise.all([
    sb.from('employees').select('*').order('created_at'),
    sb.from('clients').select('*').order('created_at'),
    sb.from('projects').select('*').order('created_at'),
    sb.from('tasks').select('*').order('created_at'),
    sb.from('shifts').select('*'),
    sb.from('logs').select('*').gte('clock_in', logCutoff()).order('clock_in', { ascending:false }),
  ]);
  const err = emp.error||cli.error||prj.error||tsk.error||shf.error||lg.error;
  if(err) throw err;
  return {
    employees:(emp.data||[]).map(mapEmp),
    clients:(cli.data||[]).map(mapClient),
    projects:(prj.data||[]).map(mapProject),
    tasks:(tsk.data||[]).map(mapTask),
    shifts:(shf.data||[]).map(mapShift),
    logs:(lg.data||[]).map(mapLog),
  };
}

// Realtime: apply a single changed row locally instead of re-downloading
// everything. This is what keeps bandwidth flat as the team grows.
const MAPPERS = { employees:mapEmp, clients:mapClient, projects:mapProject, tasks:mapTask, shifts:mapShift, logs:mapLog };
function applyChange(db, table, payload){
  const list = db[table] || [];
  if(payload.eventType === 'DELETE'){
    const gone = payload.old && payload.old.id;
    return gone ? { ...db, [table]: list.filter(r=>r.id!==gone) } : db;
  }
  if(!payload.new) return db;
  const row = MAPPERS[table](payload.new);
  if(payload.eventType === 'INSERT'){
    return list.some(r=>r.id===row.id) ? db : { ...db, [table]: [...list, row] };
  }
  return { ...db, [table]: list.map(r=> r.id===row.id ? row : r) };
}

// Recent task history (fetched on demand, never with the main payload)
async function fetchActivity({ taskId=null, limit=100 } = {}){
  let q = sb.from('task_activity').select('*').order('created_at', { ascending:false }).limit(limit);
  if(taskId) q = q.eq('task_id', taskId);
  const { data, error } = await q;
  if(error) throw error;
  return (data||[]).map(r=>({ id:r.id, taskId:r.task_id, projectId:r.project_id, actorId:r.actor_id,
    actorEmail:r.actor_email, action:r.action, changes:r.changes||[], taskLabel:r.task_label, at:r.created_at }));
}

/* Modal. The backdrop scrolls and an inner min-h-full flex centres the card:
   centring the card directly against a scrolling parent clips its top once the
   content is taller than the viewport. Header and optional footer stay pinned
   while the body scrolls, so long forms keep their title and actions in view. */
function Modal({ title, subtitle, onClose, children, footer, wide }){
  useEffect(()=>{ const h=e=>e.key==='Escape'&&onClose(); window.addEventListener('keydown',h); return ()=>window.removeEventListener('keydown',h); },[]);
  return (
    <div className="zmodal-back fixed inset-0 z-50 bg-black/60 backdrop-blur-sm overflow-y-auto" onMouseDown={onClose}>
      <div className="flex min-h-full items-center justify-center p-4">
        <div className={cls('zmodal-card glass rounded-2xl w-full shadow-glow flex flex-col max-h-[calc(100vh-2rem)]', wide?'max-w-3xl':'max-w-lg')}
             onMouseDown={e=>e.stopPropagation()}>
          <div className="shrink-0 flex items-start justify-between gap-4 px-6 pt-5 pb-4 border-b border-line/10">
            <div className="min-w-0">
              <h3 className="text-lg font-bold text-fg">{title}</h3>
              {subtitle && <p className="text-xs text-slate-400 mt-0.5">{subtitle}</p>}
            </div>
            <button onClick={onClose} className="shrink-0 text-slate-400 hover:text-fg p-1 rounded-lg hover:bg-hair/5"><Icon name="x" className="w-5 h-5"/></button>
          </div>
          <div className="p-6 overflow-y-auto">{children}</div>
          {footer && <div className="shrink-0 px-6 py-4 border-t border-line/10 bg-ink-850/40 rounded-b-2xl">{footer}</div>}
        </div>
      </div>
    </div>
  );
}

/* Groups related fields under a quiet heading so long forms stay scannable. */
function FormSection({ title, children }){
  return (
    <section>

      <div className="space-y-4">{children}</div>
    </section>
  );
}

function Field({ label, children, hint }){
  return (
    <label className="block">
      <span className="block text-xs font-semibold text-slate-400 mb-1.5">{label}</span>
      {children}
      {hint && <span className="block text-[11px] text-slate-500 mt-1">{hint}</span>}
    </label>
  );
}

function Chip({ children, className }){
  return <span className={cls('inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-semibold border', className)}>{children}</span>;
}

/* Brand mark — the Zeus emblem.

   The source artwork is a JPG lockup (emblem above a "ZEUS AI" wordmark) with
   wide margins and no transparency, so it can't be dropped in as-is: at tile
   size the emblem would be a speck, and the baked-in off-white background
   would show as a pale box.

   Instead the image is used as a *cropped background*. These numbers were
   measured from the artwork itself (emblem occupies x 444–779, y 607–964 of a
   1240×1755 image): scaling to 284% and anchoring at 48.93%/43.02% centres the
   emblem in a square tile. The JPG's own off-white fills the tile, so it reads
   as a clean logo chip in both themes with no seam.
   Only the emblem is used — the wordmark would be illegible small, and it'd be
   redundant next to the "by Zeus" text. */
const LOGO_SRC = 'zeus-logo.jpg';
const LOGO_CROP = { backgroundSize:'284% auto', backgroundPosition:'48.93% 43.02%', backgroundRepeat:'no-repeat' };

function BrandMark({ size='w-10 h-10' }){
  // Lettermark tile — used in dark mode, and as the fallback if no artwork.
  const tile = extra => (
    <div className={cls('rounded-xl place-items-center bg-gradient-to-br from-brand-600 to-cyan-800 shadow-glow shrink-0', size, extra)}>
      <span className="font-black text-white text-lg leading-none">M</span>
    </div>
  );
  if(!LOGO_SRC) return tile('grid');
  return (
    <React.Fragment>
      {/* Light: the emblem sits on its own near-white backdrop, which blends
          into the light page. */}
      <div className={cls('rounded-xl shrink-0 bg-white ring-1 ring-hair/10 dark:hidden', size)}
           style={{ backgroundImage:`url("${LOGO_SRC}")`, ...LOGO_CROP }}
           role="img" aria-label="Zeus AI" />
      {/* Dark: that same backdrop would read as a bright patch against the
          near-black UI, so use the lettermark instead. */}
      {tile('hidden dark:grid')}
    </React.Fragment>
  );
}

  return <div className={cls('rounded-xl grid place-items-center text-white font-bold text-xs bg-gradient-to-br shrink-0', size, avatarColor(emp.id))}>{initials(emp.name)}</div>;

/* Theme: remembers the user's choice, otherwise follows the OS setting. */
const THEME_KEY = 'zeus-theme';
function initTheme(){
  let t;
  try { t = localStorage.getItem(THEME_KEY); } catch(e){}
  if(t !== 'light' && t !== 'dark'){
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.classList.toggle('dark', t === 'dark');
  return t;
}
function useTheme(){
  const [theme, setTheme] = useState(initTheme);
  const set = (t) => {
    setTheme(t);
    document.documentElement.classList.toggle('dark', t === 'dark');
    try { localStorage.setItem(THEME_KEY, t); } catch(e){}
  };
  return [theme, set];
}
function ThemeToggle({ theme, setTheme }){
  const dark = theme === 'dark';
  return (
    <button onClick={()=>setTheme(dark ? 'light' : 'dark')}
      title={dark ? 'Switch to light mode' : 'Switch to dark mode'} aria-label="Toggle colour theme"
      className="w-9 h-9 shrink-0 grid place-items-center rounded-lg border border-line/25 text-slate-400 hover:text-fg hover:bg-hair/5 transition">
      <Icon name={dark ? 'sun' : 'moon'} className="w-[18px] h-[18px]"/>
    </button>
  );
}

function App(){
  const [theme, setTheme] = useTheme();
  const [session, setSession] = useState(undefined); // undefined = checking, null = logged out
  const [db, setDb] = useState({ employees:[], clients:[], projects:[], tasks:[], shifts:[], logs:[] });
  const [loaded, setLoaded] = useState(false);
  const [view, setView] = useState('dashboard');
  const [now, setNow] = useState(Date.now());

  // Auth session bootstrap
  useEffect(()=>{
    sb.auth.getSession().then(({ data })=> setSession(data.session ?? null));
    const { data:sub } = sb.auth.onAuthStateChange((_evt, s)=> setSession(s ?? null));
    return ()=> sub.subscription.unsubscribe();
  }, []);

  // Clock ticker
  useEffect(()=>{ const t=setInterval(()=>setNow(Date.now()), 30000); return ()=>clearInterval(t); }, []);

  async function refresh(){
    try { setDb(await fetchAll()); }
    catch(e){ console.error('Zeus: refresh failed', e); }
    finally { setLoaded(true); }
  }

  // Load data + subscribe to realtime once signed in
  useEffect(()=>{
    if(!session) return;
    setLoaded(false);
    refresh();
    const ch = sb.channel('zeus-all');
    ['employees','clients','projects','tasks','shifts','logs'].forEach(t=>
      ch.on('postgres_changes', { event:'*', schema:'public', table:t },
        payload => setDb(d => applyChange(d, t, payload))));
    ch.subscribe();

    // Safety net: if realtime ever drops (sleep, network blip), resync when
    // the tab regains focus rather than polling.
    const onFocus = ()=>{ if(document.visibilityState==='visible') refresh(); };
    document.addEventListener('visibilitychange', onFocus);
    return ()=> { sb.removeChannel(ch); document.removeEventListener('visibilitychange', onFocus); };
  }, [session]);

  const empById = useMemo(()=>Object.fromEntries(db.employees.map(e=>[e.id,e])), [db.employees]);
  const clientById = useMemo(()=>Object.fromEntries(db.clients.map(c=>[c.id,c])), [db.clients]);
  const projectById = useMemo(()=>Object.fromEntries(db.projects.map(p=>[p.id,p])), [db.projects]);
  const me = useMemo(()=> db.employees.find(e=> (e.email||'').toLowerCase() === (session?.user?.email||'').toLowerCase()) || null, [db.employees, session]);

  const nav = [
    { id:'dashboard', label:'Dashboard Overview', icon:'dashboard' },
    { id:'raci',      label:'Task Tracker',       icon:'grid' },
    { id:'rota',      label:'Rota & Time Tracking', icon:'clock' },
    { id:'staff',     label:'Staff Directory',    icon:'users' },
    { id:'clients',   label:'Client Management',  icon:'briefcase' },
  ];

  if(session === undefined) return <Splash text="Connecting to workspace…" />;
  if(session === null) return <Login theme={theme} setTheme={setTheme} />;
  if(!loaded) return <Splash text="Loading your team's data…" />;
  if(!me) return <NoAccess email={session.user.email} />;

  const isAdmin = me.role === 'admin';
  const ctx = { db, refresh, empById, clientById, projectById, me, isAdmin, now, setView, theme, setTheme };

  return (
    <div className="relative z-10 flex min-h-screen">
      {/* Sidebar */}
      <aside className="hidden md:flex flex-col w-64 shrink-0 border-r border-line/10 bg-ink-850/60 backdrop-blur-xl sticky top-0 h-screen">
        <div className="flex items-center gap-3 px-5 h-16 border-b border-line/10">
          <BrandMark size="w-10 h-10" />
          <div className="flex items-baseline gap-1.5 min-w-0">
            <div className="font-extrabold text-fg leading-tight tracking-tight">Milestone</div>
            <div className="text-[11px] text-slate-500 font-medium shrink-0">by Zeus</div>
          </div>
        </div>
        <nav className="flex-1 p-3 space-y-1">
          {nav.map(n=>(
            <button key={n.id} onClick={()=>setView(n.id)}
              className={cls('w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-semibold transition',
                view===n.id ? 'bg-brand-600/10 dark:bg-brand-600/20 text-fg border border-brand-500/30' : 'text-slate-400 hover:text-fg hover:bg-hair/5 border border-transparent')}>
              <Icon name={n.icon} className={cls('w-[18px] h-[18px]', view===n.id&&'text-brand-400')}/>
              {n.label}
            </button>
          ))}
        </nav>
        <div className="p-4 text-[11px] text-slate-500 border-t border-line/10">
          <div className="flex items-center gap-2"><span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Live · shared workspace</div>
        </div>
      </aside>

      {/* Main */}
      <div className="flex-1 min-w-0 flex flex-col">
        <Topbar {...ctx} nav={nav} view={view} />
        <main className="flex-1 p-5 md:p-7 max-w-[1500px] w-full mx-auto fade-in" key={view}>
          {view==='dashboard' && <Dashboard {...ctx} />}
          {view==='raci' && <TaskTracker {...ctx} />}
          {view==='rota' && <Rota {...ctx} />}
          {view==='staff' && <StaffDirectory {...ctx} />}
          {view==='clients' && <ClientManagement {...ctx} />}
        </main>
      </div>
    </div>
  );
}

/* ============================================================

function Topbar({ db, me, refresh, view, nav, theme, setTheme }){
  const openLog = db.logs.find(l=>l.employeeId===me.id && !l.clockOut);
  const [, setTick] = useState(0);
  // Tick every second either way: live elapsed time while clocked in,
  // current wall-clock time while clocked out.
  useEffect(()=>{ const t=setInterval(()=>setTick(x=>x+1),1000); return ()=>clearInterval(t); }, []);
  const [busy, setBusy] = useState(false);

  const doClockIn = async () => { setBusy(true); await store.clockIn(me.id, me.trackingArea); await refresh(); setBusy(false); };
  const doClockOut = async () => { setBusy(true); await store.clockOut(openLog.id); await refresh(); setBusy(false); };
  const elapsed = openLog ? hoursBetween(openLog.clockIn, Date.now()) : 0;
  const title = nav.find(n=>n.id===view)?.label || '';

  return (
    <header className="sticky top-0 z-30 h-16 border-b border-line/10 bg-ink-900/70 backdrop-blur-xl flex items-center gap-3 md:gap-4 px-4 md:px-7">
      <div className="min-w-0">
        <div className="text-[11px] text-slate-500 font-medium">Operations</div>
        <h1 className="text-base md:text-lg font-bold text-fg truncate -mt-0.5">{title}</h1>
      </div>
      <div className="flex-1"></div>

      <ThemeToggle theme={theme} setTheme={setTheme} />

      {/* Signed-in user */}
      <div className="hidden sm:flex items-center gap-2.5 pr-1">
        <Avatar emp={me} size="w-8 h-8"/>
        <div className="leading-tight text-right">
          <div className="text-xs font-bold text-fg truncate max-w-[130px]">{me.name}</div>
          <button onClick={()=>sb.auth.signOut()} className="text-[11px] text-slate-500 hover:text-rose-400 font-medium">Sign out</button>
        </div>
      </div>

      {/* Clock widget */}
      <div className={cls('flex items-center gap-3 rounded-xl border pl-3 pr-2 py-1.5 transition', openLog ? 'border-emerald-500/40 bg-emerald-500/10' : 'border-line/20 bg-ink-800/60')}>
        <div className="text-right leading-tight">
          <div className={cls('text-[10px] uppercase tracking-wider font-bold', openLog?'text-emerald-600 dark:text-emerald-400':'text-slate-500')}>
            {openLog ? 'On the clock' : 'Clocked out'}
          </div>
          <div className="text-sm font-bold text-fg tabnum font-mono">
            {openLog ? fmtHMS(elapsed) : fmtTime(new Date().toISOString())}
          </div>
        </div>
        {openLog
          ? <button onClick={doClockOut} disabled={busy} className="flex items-center gap-1.5 bg-rose-500 hover:bg-rose-400 disabled:opacity-60 text-white text-xs font-bold px-3 py-2 rounded-lg transition"><Icon name="logout" className="w-4 h-4"/>Clock Out</button>
          : <button onClick={doClockIn} disabled={busy} className="flex items-center gap-1.5 bg-emerald-500 hover:bg-emerald-400 disabled:opacity-60 text-white text-xs font-bold px-3 py-2 rounded-lg transition"><Icon name="login" className="w-4 h-4"/>Clock In</button>}
      </div>
    </header>
  );
}

function Dashboard({ db, empById, clientById, setView }){
  const activeTasks = db.tasks.filter(t=>t.status!=='Completed');
  const overdue = db.tasks.filter(t=>t.status!=='Completed' && t.endDate && t.endDate < todayISO());
  const clockedIn = db.logs.filter(l=>!l.clockOut);
  const completed = db.tasks.filter(t=>t.status==='Completed').length;

  const byStatus = Object.keys(TASK_STATUSES).map(s=>({ s, n: db.tasks.filter(t=>t.status===s).length }));
  const maxStatus = Math.max(1, ...byStatus.map(x=>x.n));
  const byWork = Object.keys(WORK_STATUSES).map(s=>({ s, n: db.employees.filter(e=>e.workStatus===s).length }));

  // hours this week per employee (last 7 days)
  const weekAgo = Date.now() - 7*86400000;
  const hrs = db.employees.map(e=>{
    const h = db.logs.filter(l=>l.employeeId===e.id).reduce((sum,l)=>{ const end=l.clockOut?new Date(l.clockOut).getTime():Date.now(); if(new Date(l.clockIn).getTime()>=weekAgo) sum+=hoursBetween(l.clockIn, end); return sum; },0);
    return { e, h };
  }).sort((a,b)=>b.h-a.h);
  const maxHrs = Math.max(1, ...hrs.map(x=>x.h));

  // donut for work status
  const total = db.employees.length || 1;
  let acc = 0;
  const segColors = { 'Active':'#059669','Available':'#2563eb','At Capacity':'#d97706','OOO':'#64748b' };
  const grad = byWork.map(w=>{ const start=acc/total*360; acc+=w.n; const end=acc/total*360; return `${segColors[w.s]} ${start}deg ${end}deg`; }).join(', ');

  const recent = [...db.logs].sort((a,b)=>new Date(b.clockIn)-new Date(a.clockIn)).slice(0,5);

  return (
    <div className="space-y-6">

            <button onClick={()=>setView('raci')} className="text-xs font-semibold text-brand-400 hover:text-brand-300">Open Task Tracker →</button>
          </div>
          <div className="space-y-4">
            {byStatus.map(({s,n})=>(
              <div key={s}>
                <div className="flex justify-between text-xs font-semibold mb-1.5">
                  <span className="text-slate-300">{s}</span><span className="text-slate-500 tabnum">{n}</span>
                </div>
                <div className="h-2.5 rounded-full bg-ink-700 overflow-hidden">
                  <div className={cls('h-full rounded-full transition-all', TASK_STATUSES[s].bar)} style={{width:`${n/maxStatus*100}%`}}></div>
                </div>
              </div>
            ))}
          </div>
        </div>

        {/* Work status donut */}
        <div className="glass rounded-2xl p-6">
          <h3 className="font-bold text-fg mb-5">Team Workload</h3>
          <div className="flex items-center gap-5">
            <div className="relative w-32 h-32 shrink-0 rounded-full" style={{background:`conic-gradient(${grad})`}}>

              </div>
            </div>
            <div className="space-y-2 text-sm">

            </div>

                  <div className="text-[10px] text-slate-600">{fmtTime(l.clockIn)}</div>
                </div>
              </div>
            ); })}
          </div>
        </div>
      </div>
    </div>
  );
}

   ============================================================ */
function PersonTag({ emp }){
  return <div className="flex items-center gap-1.5"><Avatar emp={emp} size="w-6 h-6 !text-[9px]"/><span className="text-xs text-slate-200 truncate max-w-[120px]">{emp.name}</span></div>;
}

function TrackerTabs({ tab, setTab }){
  return (
    <div className="inline-flex bg-ink-800/70 border border-line/15 rounded-xl p-1">
      {[['tasks','Tasks'],['activity','Activity']].map(([id,label])=>(
        <button key={id} onClick={()=>setTab(id)}
          className={cls('px-4 py-2 rounded-lg text-sm font-semibold transition', tab===id?'bg-brand-600 text-white':'text-slate-400 hover:text-fg')}>{label}</button>
      ))}
    </div>
  );
}

const ACTION_STYLE = {
  created: { chip:'bg-emerald-50 text-emerald-700 border-emerald-200 dark:bg-emerald-500/15 dark:text-emerald-300 dark:border-emerald-500/30', verb:'created' },
  updated: { chip:'bg-blue-50 text-blue-700 border-blue-200 dark:bg-blue-500/15 dark:text-blue-300 dark:border-blue-500/30',                   verb:'updated' },
  deleted: { chip:'bg-rose-50 text-rose-700 border-rose-200 dark:bg-rose-500/15 dark:text-rose-300 dark:border-rose-500/30',                   verb:'deleted' },
};

// One history entry: who did what, and which fields moved.
function ActivityRow({ entry, empById, projectById, showTask=true }){
  const actor = empById[entry.actorId];
  const st = ACTION_STYLE[entry.action] || ACTION_STYLE.updated;
  const proj = projectById && projectById[entry.projectId];
  return (
    <div className="flex gap-3 py-3 border-b border-hair/5 last:border-0">
      {actor ? <Avatar emp={actor} size="w-7 h-7 !text-[9px]"/> :
        <div className="w-7 h-7 rounded-xl bg-ink-700 grid place-items-center text-slate-500 text-[9px] shrink-0">?</div>}
      <div className="min-w-0 flex-1">
        <div className="flex flex-wrap items-center gap-x-2 gap-y-1 text-sm">
          <span className="font-semibold text-fg">{actor ? actor.name : (entry.actorEmail || 'Unknown')}</span>
          <Chip className={st.chip}>{st.verb}</Chip>
          {showTask && <span className="text-slate-300 truncate">{entry.taskLabel || 'a task'}</span>}
        </div>
        {entry.changes && entry.changes.length>0 && (
          <div className="mt-1.5 space-y-1">
            {entry.changes.map((c,i)=>(
              <div key={i} className="text-[11px] flex flex-wrap items-center gap-1.5">
                <span className="text-slate-500 font-semibold">{c.field}</span>
                <span className="text-slate-500 line-through truncate max-w-[140px]">{c.from || '—'}</span>
                <span className="text-slate-600">→</span>
                <span className="text-slate-200 font-medium truncate max-w-[140px]">{c.to || '—'}</span>
              </div>
            ))}
          </div>
        )}
        <div className="text-[10px] text-slate-600 mt-1">
          {fmtDateTime(entry.at)}{proj ? ' · '+proj.name : ''}
        </div>
      </div>
    </div>
  );
}

// Global feed of recent task changes.
function ActivityFeed({ db, empById, projectById }){
  const [entries, setEntries] = useState(null);
  const [err, setErr] = useState('');
  const [fPerson, setFPerson] = useState('all');
  const [fProject, setFProject] = useState('all');

  useEffect(()=>{
    let alive = true;
    fetchActivity({ limit:200 })
      .then(rows=>{ if(alive) setEntries(rows); })
      .catch(e=>{ if(alive) setErr(e.message||String(e)); });
    return ()=>{ alive = false; };
  }, []);

  let list = entries || [];
  if(fPerson!=='all')  list = list.filter(e=>e.actorId===fPerson);
  if(fProject!=='all') list = list.filter(e=>e.projectId===fProject);

  return (
    <div className="space-y-5">
      <div className="glass rounded-2xl p-4 flex flex-wrap items-center gap-3">
        <div className="flex items-center gap-2 text-slate-400 text-xs font-bold uppercase tracking-wider mr-1"><Icon name="filter" className="w-4 h-4"/>Filter</div>
        <select className="zi !w-auto !py-2 text-sm" value={fPerson} onChange={e=>setFPerson(e.target.value)}>
          <option value="all">Anyone</option>
          {db.employees.map(e=><option key={e.id} value={e.id}>{e.name}</option>)}
        </select>
        <select className="zi !w-auto !py-2 text-sm" value={fProject} onChange={e=>setFProject(e.target.value)}>
          <option value="all">All Projects</option>
          {db.projects.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
        </select>
        <span className="ml-auto text-[11px] text-slate-500">{list.length} of the 200 most recent changes</span>
      </div>

      <div className="glass rounded-2xl px-5 py-2">
        {err && <p className="text-rose-400 text-sm py-8 text-center">Couldn’t load activity: {err}</p>}
        {!err && entries===null && <p className="text-slate-500 text-sm py-10 text-center">Loading activity…</p>}
        {!err && entries!==null && list.length===0 && <p className="text-slate-500 text-sm py-10 text-center">No task activity recorded yet.</p>}
        {list.map(e=><ActivityRow key={e.id} entry={e} empById={empById} projectById={projectById} />)}
      </div>
    </div>
  );
}

// History for a single task, shown inside the edit modal.
function TaskHistory({ taskId, empById }){
  const [entries, setEntries] = useState(null);
  useEffect(()=>{
    let alive = true;
    fetchActivity({ taskId, limit:500 }).then(r=>{ if(alive) setEntries(r); }).catch(()=>{ if(alive) setEntries([]); });
    return ()=>{ alive = false; };
  }, [taskId]);
  return (
    <div className="rounded-xl border border-hair/10 bg-ink-900/40 px-4">
      {entries===null && <p className="text-xs text-slate-500 py-4">Loading history…</p>}
      {entries!==null && entries.length===0 && <p className="text-xs text-slate-500 py-4">No changes recorded yet.</p>}
      {(entries||[]).map(e=><ActivityRow key={e.id} entry={e} empById={empById} showTask={false} />)}
    </div>
  );
}

function TaskTracker({ db, refresh, empById, clientById, projectById, isAdmin }){
  const [tab, setTab] = useState('tasks');
  const [fClient, setFClient] = useState('all');
  const [fProject, setFProject] = useState('all');
  const [fPerson, setFPerson] = useState('all');
  const [fStatus, setFStatus] = useState('all');
  const [editTask, setEditTask] = useState(null);   // null | 'new' | taskObj
  const [showImport, setShowImport] = useState(false);

  const projectsForClient = fClient==='all' ? db.projects : db.projects.filter(p=>p.clientId===fClient);

  const tasks = db.tasks.filter(t=>{
    const p = projectById[t.projectId]; if(!p) return false;
    if(fClient!=='all' && p.clientId!==fClient) return false;
    if(fProject!=='all' && t.projectId!==fProject) return false;
    if(fPerson!=='all' && t.developerId!==fPerson && t.checkerId!==fPerson) return false;
    if(fStatus!=='all' && t.status!==fStatus) return false;
    return true;
  });

  const groups = {};
  tasks.forEach(t=>{ (groups[t.projectId]=groups[t.projectId]||[]).push(t); });
  Object.values(groups).forEach(list=> list.sort((a,b)=>
    (a.primaryTask||'').localeCompare(b.primaryTask||'') ||
    (a.subTask||'').localeCompare(b.subTask||'') ||
    (a.detailedTask||'').localeCompare(b.detailedTask||'')));

  const setStatus = async (id, status) => { await store.setTaskStatus(id, status); refresh(); };
  const delTask = async (id) => { if(!confirm('Delete this task?')) return; await store.deleteTask(id); refresh(); };

  const exportXlsx = () => {
    const rows = tasks.map(t=>({
      'Primary Task': t.primaryTask||'',
      'Sub task': t.subTask||'',
      'Detailed Task': t.detailedTask||'',
      'Developer': empById[t.developerId]?.name || '',
      'Start date': t.startDate||'',
      'End date': t.endDate||'',
      'Current status': t.status||'',
      'Checker': empById[t.checkerId]?.name || '',
    }));
    const header = ['Primary Task','Sub task','Detailed Task','Developer','Start date','End date','Current status','Checker'];
    const ws = XLSX.utils.json_to_sheet(rows, { header });
    if(!rows.length) XLSX.utils.sheet_add_aoa(ws, [header]);
    ws['!cols'] = header.map((h,i)=>({ wch: i<3?26:16 }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Tasks');
    XLSX.writeFile(wb, `milestone-tasks-${todayISO()}.xlsx`);
  };

  const noProjects = db.projects.length===0;

  if(tab === 'activity') return (
    <div className="space-y-5">
      <TrackerTabs tab={tab} setTab={setTab} />
      <ActivityFeed db={db} empById={empById} projectById={projectById} />
    </div>
  );

  return (
    <div className="space-y-5">
      <TrackerTabs tab={tab} setTab={setTab} />

      {/* Filters + actions */}
      <div className="glass rounded-2xl p-4 flex flex-wrap items-center gap-3">
        <div className="flex items-center gap-2 text-slate-400 text-xs font-bold uppercase tracking-wider mr-1"><Icon name="filter" className="w-4 h-4"/>Filter</div>
        <select className="zi !w-auto !py-2 text-sm" value={fClient} onChange={e=>{ setFClient(e.target.value); setFProject('all'); }}>
          <option value="all">All Clients</option>
          {db.clients.map(c=><option key={c.id} value={c.id}>{c.company}</option>)}
        </select>
        <select className="zi !w-auto !py-2 text-sm" value={fProject} onChange={e=>setFProject(e.target.value)}>
          <option value="all">All Projects</option>
          {projectsForClient.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
        </select>
        <select className="zi !w-auto !py-2 text-sm" value={fPerson} onChange={e=>setFPerson(e.target.value)}>
          <option value="all">Anyone (dev/checker)</option>
          {db.employees.map(e=><option key={e.id} value={e.id}>{e.name}</option>)}
        </select>
        <select className="zi !w-auto !py-2 text-sm" value={fStatus} onChange={e=>setFStatus(e.target.value)}>
          <option value="all">Any Status</option>
          {Object.keys(TASK_STATUSES).map(s=><option key={s} value={s}>{s}</option>)}
        </select>
        <div className="flex-1"></div>
        <button onClick={()=>setShowImport(true)} disabled={noProjects} title={noProjects?'Create a project first':'Import tasks from Excel/CSV'}
          className="flex items-center gap-1.5 border border-line/25 text-slate-200 hover:bg-hair/5 disabled:opacity-40 text-sm font-semibold px-3 py-2 rounded-lg transition"><Icon name="upload" className="w-4 h-4"/>Import</button>
        <button onClick={exportXlsx} title="Export tasks to Excel"
          className="flex items-center gap-1.5 border border-line/25 text-slate-200 hover:bg-hair/5 text-sm font-semibold px-3 py-2 rounded-lg transition"><Icon name="download" className="w-4 h-4"/>Export</button>
        <button onClick={()=>setEditTask('new')} disabled={noProjects} title={noProjects?'Create a project first':''}
          className="flex items-center gap-1.5 bg-brand-600 hover:bg-brand-500 disabled:opacity-40 text-white text-sm font-bold px-3.5 py-2 rounded-lg transition"><Icon name="plus" className="w-4 h-4"/>New Task</button>
      </div>

      {noProjects && (
        <div className="glass rounded-2xl p-10 text-center text-slate-400 text-sm">
          No projects yet. Add a client and a project under <b className="text-fg">Client Management</b> first, then create or import tasks here.
        </div>
      )}

      {!noProjects && Object.keys(groups).length===0 && (
        <div className="glass rounded-2xl p-10 text-center text-slate-500 text-sm">No tasks match these filters.</div>
      )}

      {Object.entries(groups).map(([pid, list])=>{
        const p = projectById[pid];
        return (
          <div key={pid} className="glass rounded-2xl overflow-hidden">
            <div className="px-5 py-3 bg-brand-600/10 border-b border-brand-500/15 flex items-center gap-2">
              <Icon name="briefcase" className="w-4 h-4 text-brand-300"/>
              <span className="text-sm font-bold text-fg">{clientById[p?.clientId]?.company || 'Unknown client'}</span>
              <span className="text-slate-600">/</span>
              <span className="text-sm font-bold text-brand-300">{p?.name || 'Unknown project'}</span>
              <span className="ml-auto text-[11px] text-slate-500">{list.length} task{list.length===1?'':'s'}</span>
            </div>
            <div className="overflow-x-auto">
              <table className="w-full border-collapse min-w-[1120px] text-sm">
                <thead>
                  <tr className="bg-ink-800/60 text-left text-[11px] font-bold text-slate-400 uppercase tracking-wider">
                    <th className="px-4 py-2.5">Primary Task</th>
                    <th className="px-4 py-2.5">Sub task</th>
                    <th className="px-4 py-2.5">Task ID</th>
                    <th className="px-4 py-2.5">Detailed Task</th>
                    <th className="px-4 py-2.5">Raised by</th>
                    <th className="px-4 py-2.5">Developer / Employee</th>
                    <th className="px-4 py-2.5">Checker</th>
                    <th className="px-4 py-2.5">Start</th>
                    <th className="px-4 py-2.5">End</th>
                    <th className="px-4 py-2.5">Status</th>
                    <th className="px-3 py-2.5"></th>
                  </tr>
                </thead>
                <tbody>
                  {list.map((t, i)=>{
                    const prev = list[i-1];
                    const showPrimary = !prev || prev.primaryTask!==t.primaryTask;
                    const showSub = showPrimary || prev.subTask!==t.subTask;
                    const dev = empById[t.developerId];
                    const chk = empById[t.checkerId];
                    const creator = empById[t.createdBy];
                    const overdue = t.status!=='Completed' && t.endDate && t.endDate < todayISO();
                    return (
                      <tr key={t.id} className="border-b border-hair/5 hover:bg-hair/[0.02] group align-top">
                        <td className="px-4 py-2.5 font-semibold text-fg">{showPrimary ? (t.primaryTask||'—') : ''}</td>
                        <td className="px-4 py-2.5 text-slate-300">{showSub ? (t.subTask||'—') : ''}</td>
                        <td className="px-4 py-2.5 whitespace-nowrap">
                          <button onClick={()=>setEditTask(t)} title="Open task details" className="font-mono text-xs font-semibold text-brand-600 dark:text-brand-300 hover:underline">{taskCode(t.seq)}</button>
                        </td>
                        <td className="px-4 py-2.5 text-slate-200">{t.detailedTask}</td>
                        <td className="px-4 py-2.5">{creator ? <PersonTag emp={creator}/> : <span className="text-slate-600">—</span>}</td>
                        <td className="px-4 py-2.5">{dev ? <PersonTag emp={dev}/> : <span className="text-slate-600">—</span>}</td>
                        <td className="px-4 py-2.5">{chk ? <PersonTag emp={chk}/> : <span className="text-slate-600">—</span>}</td>
                        <td className="px-4 py-2.5 text-xs text-slate-400 whitespace-nowrap">{fmtDate(t.startDate)}</td>
                        <td className={cls('px-4 py-2.5 text-xs whitespace-nowrap', overdue?'text-rose-400 font-bold':'text-slate-400')}>{overdue&&<Icon name="alert" className="w-3 h-3 inline mr-1"/>}{fmtDate(t.endDate)}</td>
                        <td className="px-4 py-2.5">
                          <select value={t.status} onChange={e=>setStatus(t.id, e.target.value)} className={cls('rounded-full text-[10px] font-bold border px-2 py-1 appearance-none cursor-pointer outline-none', (TASK_STATUSES[t.status]||TASK_STATUSES['Not Started']).chip)}>
                            {Object.keys(TASK_STATUSES).map(s=><option key={s} value={s} className="bg-ink-800 text-fg">{s}</option>)}
                          </select>
                        </td>
                        <td className="px-3 py-2.5 whitespace-nowrap text-right">
                          <button onClick={()=>setEditTask(t)} className="opacity-0 group-hover:opacity-100 text-slate-500 hover:text-brand-300 transition mr-1" title="Edit"><Icon name="pencil" className="w-3.5 h-3.5"/></button>
                          {isAdmin && <button onClick={()=>delTask(t.id)} className="opacity-0 group-hover:opacity-100 text-slate-500 hover:text-rose-400 transition" title="Delete"><Icon name="trash" className="w-3.5 h-3.5"/></button>}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        );
      })}

      {editTask && <TaskModal db={db} refresh={refresh} empById={empById} isAdmin={isAdmin} task={editTask==='new'?null:editTask} defaultProjectId={fProject!=='all'?fProject:''} onClose={()=>setEditTask(null)} />}
      {showImport && <ImportModal db={db} refresh={refresh} onClose={()=>setShowImport(false)} />}
    </div>
  );
}

function TaskModal({ db, refresh, empById, task, defaultProjectId, isAdmin=true, onClose }){
  const editing = !!task;
  const ro = false;   // every team member can create and edit tasks
  const creator = task && empById[task.createdBy];
  const [f, setF] = useState({
    projectId:    task?.projectId    || defaultProjectId || (db.projects[0]?.id || ''),
    primaryTask:  task?.primaryTask  || '',
    subTask:      task?.subTask      || '',
    detailedTask: task?.detailedTask || '',
    developerId:  task?.developerId  || '',
    checkerId:    task?.checkerId    || '',
    startDate:    task?.startDate    || '',
    endDate:      task?.endDate      || '',
    status:       task?.status       || 'Not Started',
    description:        task?.description        || '',
    businessValue:      task?.businessValue      || '',
    acceptanceCriteria: task?.acceptanceCriteria || '',
    comments:           task?.comments           || '',
  });
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  const up = (k,v) => setF(s=>({ ...s, [k]:v }));

  const submit = async () => {
    if(!f.projectId) return setErr('Pick a project.');
    if(!f.detailedTask.trim()) return setErr('Detailed Task is required.');
    setBusy(true);
    const payload = { ...f, detailedTask:f.detailedTask.trim(), developerId:f.developerId||null, checkerId:f.checkerId||null };
    const { error } = editing ? await store.updateTask(task.id, payload) : await store.addTask(payload);
    setBusy(false);
    if(error) return setErr(error.message);
    refresh(); onClose();
  };

  return (
    <Modal title={ro?'Task Details':(editing?'Edit Task':'New Task')}
           subtitle={editing?(taskCode(task.seq)+(creator?' · raised by '+creator.name:'')):"A task under a client's project"}
           onClose={onClose} wide
           footer={
             <div className="flex items-center gap-3">
               {err && <p className="text-rose-400 text-xs font-semibold flex-1">{err}</p>}
               <div className={cls('flex gap-3', err?'':'flex-1')}>
                 <button onClick={onClose} className="flex-1 px-5 py-2.5 rounded-lg border border-hair/10 text-slate-300 font-semibold text-sm hover:bg-hair/5">{ro?'Close':'Cancel'}</button>
                 {!ro && <button onClick={submit} disabled={busy} className="flex-1 px-5 py-2.5 rounded-lg bg-brand-600 hover:bg-brand-500 disabled:opacity-60 text-white font-bold text-sm whitespace-nowrap">{busy?'Saving…':(editing?'Save changes':'Create Task')}</button>}
               </div>
             </div>
           }>
      <div className="divide-y divide-line/10 -my-2">
        <div className="py-5 first:pt-0">
          <FormSection title="Where it lives">
            <Field label="Project">
              <select className="zi" disabled={ro} value={f.projectId} onChange={e=>up('projectId', e.target.value)}>
                {db.projects.length===0 && <option value="">No projects — add one in Client Management</option>}
                {db.projects.map(p=>{ const c=db.clients.find(x=>x.id===p.clientId); return <option key={p.id} value={p.id}>{(c?.company||'?')+' · '+p.name}</option>; })}
              </select>
            </Field>
          </FormSection>
        </div>

        <div className="py-5">
          <FormSection title="The task">
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <Field label="Primary Task"><input className="zi" disabled={ro} value={f.primaryTask} onChange={e=>up('primaryTask',e.target.value)} placeholder="e.g. Checkout revamp"/></Field>
              <Field label="Sub task"><input className="zi" disabled={ro} value={f.subTask} onChange={e=>up('subTask',e.target.value)} placeholder="e.g. Payment API"/></Field>
            </div>
            <Field label="Detailed Task"><input className="zi" disabled={ro} value={f.detailedTask} onChange={e=>up('detailedTask',e.target.value)} placeholder="The specific work item" autoFocus={!ro}/></Field>
          </FormSection>
        </div>

        <div className="py-5">
          <FormSection title="People &amp; schedule">
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <Field label="Developer / Employee"><select className="zi" disabled={ro} value={f.developerId} onChange={e=>up('developerId',e.target.value)}><option value="">— Unassigned —</option>{db.employees.map(e=><option key={e.id} value={e.id}>{e.name}</option>)}</select></Field>
              <Field label="Checker"><select className="zi" disabled={ro} value={f.checkerId} onChange={e=>up('checkerId',e.target.value)}><option value="">— Unassigned —</option>{db.employees.map(e=><option key={e.id} value={e.id}>{e.name}</option>)}</select></Field>
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
              <Field label="Start date"><input type="date" className="zi" disabled={ro} value={f.startDate||''} onChange={e=>up('startDate',e.target.value)}/></Field>
              <Field label="End date"><input type="date" className="zi" disabled={ro} value={f.endDate||''} onChange={e=>up('endDate',e.target.value)}/></Field>
              <Field label="Status"><select className="zi" disabled={ro} value={f.status} onChange={e=>up('status',e.target.value)}>{Object.keys(TASK_STATUSES).map(s=><option key={s} value={s}>{s}</option>)}</select></Field>
            </div>
          </FormSection>
        </div>

        <div className="py-5">
          <FormSection title="Detail">
            <Field label="Description"><textarea className="zi" rows={3} disabled={ro} value={f.description} onChange={e=>up('description',e.target.value)} placeholder="What needs to be done"/></Field>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <Field label="Business Value"><textarea className="zi" rows={3} disabled={ro} value={f.businessValue} onChange={e=>up('businessValue',e.target.value)} placeholder="Why it matters / impact"/></Field>
              <Field label="Acceptance Criteria"><textarea className="zi" rows={3} disabled={ro} value={f.acceptanceCriteria} onChange={e=>up('acceptanceCriteria',e.target.value)} placeholder="Definition of done"/></Field>
            </div>
            <Field label="Comments"><textarea className="zi" rows={3} disabled={ro} value={f.comments} onChange={e=>up('comments',e.target.value)} placeholder="Notes, blockers, updates"/></Field>
            {editing && (
              <div className="flex items-center gap-2 text-xs text-slate-500 pt-1">
                <span className="font-semibold">Raised by</span>
                {creator ? <><Avatar emp={creator} size="w-5 h-5 !text-[8px] !rounded-md"/><span className="text-slate-300">{creator.name}</span></> : <span>—</span>}
              </div>
            )}
          </FormSection>
        </div>

        {editing && (
          <div className="py-5 last:pb-0">
            <FormSection title="History">
              <TaskHistory taskId={task.id} empById={empById} />
            </FormSection>
          </div>
        )}
      </div>
    </Modal>
  );
}

function ImportModal({ db, refresh, onClose }){
  const [clientId, setClientId] = useState(db.clients[0]?.id || '');
  const clientProjects = db.projects.filter(p=>p.clientId===clientId);
  const [projectId, setProjectId] = useState(clientProjects[0]?.id || '');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const fileRef = useRef(null);

  useEffect(()=>{ const list=db.projects.filter(p=>p.clientId===clientId); setProjectId(list[0]?.id||''); }, [clientId]);

  const pick = (row, keys) => { for(const k of keys){ if(row[k]!=null && String(row[k]).trim()!=='') return row[k]; } return ''; };

  const run = async (e) => {
    const file = e.target.files && e.target.files[0]; e.target.value='';
    if(!file) return;
    if(!projectId){ setErr('Pick a client and project first.'); return; }
    setBusy(true); setErr('');
    try {
      const wb = XLSX.read(await file.arrayBuffer(), { cellDates:true });
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval:'' });
      const empByKey = {}; db.employees.forEach(em=>{ empByKey[em.name.trim().toLowerCase()]=em.id; if(em.email) empByKey[em.email.trim().toLowerCase()]=em.id; });
      const validStatus = new Set(Object.keys(TASK_STATUSES));
      const unmatched = new Set(); let skipped=0; const toInsert=[];
      const findEmp = raw => { const nm=String(raw||'').trim(); if(!nm) return null; const id=empByKey[nm.toLowerCase()]; if(!id) unmatched.add(nm); return id||null; };
      for(const row of rows){
        const detailed = String(pick(row,['Detailed Task','Detailed task','Task','Detail'])).trim();
        if(!detailed){ if(Object.values(row).some(v=>String(v).trim())) skipped++; continue; }
        let status = String(pick(row,['Current status','Current Status','Status'])).trim();
        if(!validStatus.has(status)) status='Not Started';
        toInsert.push({
          projectId,
          primaryTask: String(pick(row,['Primary Task','Primary task'])).trim() || null,
          subTask:     String(pick(row,['Sub task','Sub Task','Subtask'])).trim() || null,
          detailedTask: detailed,
          developerId: findEmp(pick(row,['Developer','Assignee','Owner'])),
          checkerId:   findEmp(pick(row,['Checker','Reviewer','QA'])),
          startDate:   toISODate(pick(row,['Start date','Start Date','Start'])),
          endDate:     toISODate(pick(row,['End date','End Date','End','Due Date'])),
          status,
        });
      }
      if(toInsert.length){ const { error } = await store.addTasks(toInsert); if(error) throw error; }
      await refresh();
      let msg = `Imported ${toInsert.length} task${toInsert.length===1?'':'s'}.`;
      if(skipped) msg += ` Skipped ${skipped} row${skipped===1?'':'s'} (no Detailed Task).`;
      if(unmatched.size) msg += `\n\nNot found on the staff roster — left unassigned:\n• ${[...unmatched].join('\n• ')}`;
      alert(msg);
      onClose();
    } catch(e){ setErr('Import failed: '+(e.message||e)); }
    finally { setBusy(false); }
  };

  return (
    <Modal title="Import Tasks" subtitle="From Excel/CSV with your 8 columns" onClose={onClose}>
      <div className="space-y-4">
        <p className="text-xs text-slate-400 leading-relaxed">Columns read: <span className="text-slate-300 font-mono text-[11px]">Primary Task · Sub task · Detailed Task · Developer · Start date · End date · Current status · Checker</span>. Every row imports into the client &amp; project you pick here.</p>
        <div className="grid grid-cols-2 gap-4">
          <Field label="Client"><select className="zi" value={clientId} onChange={e=>setClientId(e.target.value)}>{db.clients.length===0&&<option value="">No clients</option>}{db.clients.map(c=><option key={c.id} value={c.id}>{c.company}</option>)}</select></Field>
          <Field label="Project"><select className="zi" value={projectId} onChange={e=>setProjectId(e.target.value)}>{clientProjects.length===0&&<option value="">No projects for this client</option>}{clientProjects.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select></Field>
        </div>
        {err && <p className="text-rose-400 text-xs font-semibold">{err}</p>}
        <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv" className="hidden" onChange={run}/>
        <div className="flex gap-3 pt-1">
          <button onClick={onClose} className="flex-1 py-2.5 rounded-lg border border-hair/10 text-slate-300 font-semibold text-sm hover:bg-hair/5">Cancel</button>
          <button onClick={()=>fileRef.current&&fileRef.current.click()} disabled={busy||!projectId} className="flex-1 py-2.5 rounded-lg bg-brand-600 hover:bg-brand-500 disabled:opacity-60 text-white font-bold text-sm">{busy?'Importing…':'Choose file & import'}</button>
        </div>
      </div>
    </Modal>
  );
}

const LOG_RANGES = [[String(LOG_WINDOW_DAYS),`Last ${LOG_WINDOW_DAYS} days`],['90','Last 90 days'],['365','Last year'],['0','All time']];

function TimeLog({ db, empById, fEmp }){
  const [range, setRange] = useState(String(LOG_WINDOW_DAYS));
  const [older, setOlder] = useState(null);   // rows fetched for a wider range
  const [busy, setBusy] = useState(false);
  const [totals, setTotals] = useState(null); // summed by the database

  // Hour totals come from the server, so they stay correct no matter how
  // few records are loaded on screen.
  useEffect(()=>{
    let alive = true;
    sb.rpc('employee_hours').then(({ data, error })=>{ if(alive && !error) setTotals(data||[]); });
    return ()=>{ alive = false; };
  }, [db.logs.length]);

  const chooseRange = async (val) => {
    setRange(val);
    if(val !== '0' && Number(val) <= LOG_WINDOW_DAYS){ setOlder(null); return; }
    setBusy(true);
    let q = sb.from('logs').select('*').order('clock_in', { ascending:false }).limit(2000);
    if(val !== '0') q = q.gte('clock_in', new Date(Date.now()-Number(val)*86400000).toISOString());
    const { data } = await q;
    setOlder((data||[]).map(mapLog));
    setBusy(false);
  };

  let logs = older || db.logs;
  if(fEmp!=='all') logs = logs.filter(l=>l.employeeId===fEmp);
  logs = [...logs].sort((a,b)=>new Date(b.clockIn)-new Date(a.clockIn));

  const totalList = (totals||[]).map(t=>({ e:empById[t.employee_id], h:Number(t.hours)||0 }))
    .filter(x=>x.e).sort((a,b)=>b.h-a.h);

  return (
    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div className="glass rounded-2xl overflow-hidden lg:col-span-2">
        <div className="flex items-center gap-3 px-5 py-3 border-b border-hair/5">
          <span className="text-[11px] uppercase tracking-wider text-slate-500 font-semibold">Showing</span>
          <select className="zi !w-auto !py-1.5 text-xs" value={range} onChange={e=>chooseRange(e.target.value)}>
            {LOG_RANGES.map(([v,l])=><option key={v} value={v}>{l}</option>)}
          </select>
          {busy && <span className="text-[11px] text-slate-500">loading…</span>}
          <span className="ml-auto text-[11px] text-slate-500">{logs.length} record{logs.length===1?'':'s'}</span>
        </div>
        <div className="overflow-x-auto">
          <table className="w-full border-collapse min-w-[620px]">
            <thead><tr className="bg-ink-800/80 text-left text-[11px] font-bold text-slate-400 uppercase tracking-wider">
              <th className="px-5 py-3">Employee</th><th className="px-4 py-3">Area</th><th className="px-4 py-3">Clock In</th><th className="px-4 py-3">Clock Out</th><th className="px-4 py-3 text-right">Duration</th>
            </tr></thead>
            <tbody>
              {logs.length===0 && <tr><td colSpan={5} className="text-center text-slate-500 py-12 text-sm">No clock records yet.</td></tr>}
              {logs.map(l=>{ const e=empById[l.employeeId]; if(!e) return null; const live=!l.clockOut; const dur=hoursBetween(l.clockIn, l.clockOut?new Date(l.clockOut).getTime():Date.now()); return (
                <tr key={l.id} className="border-b border-hair/5 hover:bg-hair/[0.02]">
                  <td className="px-5 py-3"><div className="flex items-center gap-2.5"><Avatar emp={e} size="w-7 h-7"/><span className="text-sm font-semibold text-fg">{e.name}</span></div></td>
                  <td className="px-4 py-3"><span className="text-xs text-slate-400 flex items-center gap-1"><Icon name="pin" className="w-3 h-3"/>{l.area}</span></td>
                  <td className="px-4 py-3 text-xs text-slate-300 font-mono">{fmtDateTime(l.clockIn)}</td>
                  <td className="px-4 py-3 text-xs font-mono">{live? <Chip className="bg-emerald-50 text-emerald-700 border-emerald-200 dark:bg-emerald-500/15 dark:text-emerald-300 dark:border-emerald-500/30">active</Chip> : <span className="text-slate-300">{fmtDateTime(l.clockOut)}</span>}</td>
                  <td className="px-4 py-3 text-right text-xs font-mono font-bold text-fg tabnum">{fmtDurSec(dur)}</td>
                </tr>
              );})}
            </tbody>
          </table>
        </div>
      </div>

      <div className="glass rounded-2xl p-6">
        <h3 className="font-bold text-fg">Total Hours Worked</h3>
        <p className="text-[11px] text-slate-500 mb-4">All-time, calculated on the server</p>
        <div className="space-y-3">
          {totals===null && <p className="text-xs text-slate-500">Loading totals…</p>}
          {totals!==null && totalList.length===0 && <p className="text-xs text-slate-500">No clock records yet.</p>}
          {totalList.map(({e,h})=>(
            <div key={e.id} className="flex items-center gap-3">
              <Avatar emp={e} size="w-8 h-8"/>
              <div className="flex-1 min-w-0"><div className="text-sm font-semibold text-fg truncate">{e.name}</div><div className="text-[11px] text-slate-500">{e.designation}</div></div>
              <div className="text-sm font-mono font-bold text-brand-300 tabnum">{fmtDur(h)}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function EmployeeModal({ db, refresh, employee, onClose }){
  const editing = !!employee;
  const [f, setF] = useState({
    name:         employee?.name || '',
    email:        employee?.email || '',
    designation:  employee?.designation || DESIGNATIONS[0],
    department:   employee?.department || DEPARTMENTS[0],
    trackingArea: employee?.trackingArea || TRACKING_AREAS[0],
    workStatus:   employee?.workStatus || 'Available',
    managerId:    employee?.managerId || '',
  });
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  const up = (k,v) => setF(s=>({...s,[k]:v}));

  // Nobody can be their own reporting manager
  const managerOptions = db.employees.filter(e=> !editing || e.id!==employee.id);

  const submit = async () => {
    if(!f.name.trim()) return setErr('Name is required.');
    if(!f.email.trim() || !f.email.includes('@')) return setErr('A valid email is required.');
    setBusy(true);
    const payload = { ...f, name:f.name.trim(), email:f.email.trim(), managerId:f.managerId||null };
    const { error } = editing ? await store.updateEmployee(employee.id, payload) : await store.addEmployee(payload);
    setBusy(false);
    if(error) return setErr(String(error.message).includes('duplicate') ? 'That email is already on the roster.' : error.message);
    refresh(); onClose();
  };

  return (
    <Modal title={editing?'Edit Team Member':'Add Team Member'} subtitle={editing?'Update this employee’s details':'Onboard a new employee to Milestone'} onClose={onClose}>
      <div className="space-y-4">
        <div className="grid grid-cols-2 gap-4">
          <Field label="Full name"><input className="zi" value={f.name} onChange={e=>up('name',e.target.value)} placeholder="Jordan Lee" autoFocus/></Field>
          <Field label="Email" hint={editing?'This is their sign-in address — changing it changes their access.':'Must be the Google account they sign in with.'}>
            <input className="zi" value={f.email} onChange={e=>up('email',e.target.value)} placeholder="jordan@zeus.ai"/>
          </Field>
        </div>
        <div className="grid grid-cols-2 gap-4">
          <Field label="Designation"><select className="zi" value={f.designation} onChange={e=>up('designation',e.target.value)}>{DESIGNATIONS.map(d=><option key={d}>{d}</option>)}</select></Field>
          <Field label="Department"><select className="zi" value={f.department} onChange={e=>up('department',e.target.value)}>{DEPARTMENTS.map(d=><option key={d}>{d}</option>)}</select></Field>
        </div>
        <div className="grid grid-cols-2 gap-4">
          <Field label="Default tracking area"><select className="zi" value={f.trackingArea} onChange={e=>up('trackingArea',e.target.value)}>{TRACKING_AREAS.map(a=><option key={a}>{a}</option>)}</select></Field>
          <Field label="Work status"><select className="zi" value={f.workStatus} onChange={e=>up('workStatus',e.target.value)}>{Object.keys(WORK_STATUSES).map(s=><option key={s}>{s}</option>)}</select></Field>
        </div>
        <Field label="Reporting manager">
          <select className="zi" value={f.managerId} onChange={e=>up('managerId',e.target.value)}>
            <option value="">— None —</option>
            {managerOptions.map(e=><option key={e.id} value={e.id}>{e.name} · {e.designation}</option>)}
          </select>
        </Field>
        {err && <p className="text-rose-400 text-xs font-semibold">{err}</p>}
        <div className="flex gap-3 pt-1">
          <button onClick={onClose} className="flex-1 py-2.5 rounded-lg border border-hair/10 text-slate-300 font-semibold text-sm hover:bg-hair/5">Cancel</button>
          <button onClick={submit} disabled={busy} className="flex-1 py-2.5 rounded-lg bg-brand-600 hover:bg-brand-500 disabled:opacity-60 text-white font-bold text-sm">{busy?'Saving…':(editing?'Save changes':'Add Employee')}</button>
        </div>
      </div>
    </Modal>
  );
}

/* ============================================================
   CLIENT MANAGEMENT
   ============================================================ */
function ClientManagement({ db, refresh, empById, isAdmin }){
  const [showAddClient, setShowAddClient] = useState(false);
  const [projModal, setProjModal] = useState(null); // null | {clientId} (new) | project (edit)

  const delClient = async id => {
    if(!confirm('Delete this client? All its projects and tasks will be removed too.')) return;
    await store.deleteClient(id); refresh();
  };
  const delProject = async id => {
    if(!confirm('Delete this project? All its tasks will be removed too.')) return;
    await store.deleteProject(id); refresh();
  };

  const tasksByProject = {};
  db.tasks.forEach(t=>{ (tasksByProject[t.projectId]=tasksByProject[t.projectId]||[]).push(t); });
  const projStatusChip = s =>
    s==='Completed' ? 'bg-emerald-50 text-emerald-700 border-emerald-200 dark:bg-emerald-500/15 dark:text-emerald-300 dark:border-emerald-500/30'
  : s==='On Hold'   ? 'bg-amber-50 text-amber-700 border-amber-200 dark:bg-amber-500/15 dark:text-amber-300 dark:border-amber-500/30'
  :                   'bg-brand-50 text-brand-700 border-brand-200 dark:bg-brand-500/15 dark:text-brand-300 dark:border-brand-500/30';

  return (
    <div className="space-y-5">
      <div className="flex items-center justify-between">
        <p className="text-sm text-slate-400">{db.clients.length} clients · {db.projects.length} projects · {db.tasks.length} tasks</p>
        {isAdmin && <button onClick={()=>setShowAddClient(true)} className="flex items-center gap-1.5 bg-brand-600 hover:bg-brand-500 text-white text-sm font-bold px-3.5 py-2.5 rounded-lg"><Icon name="plus" className="w-4 h-4"/>Add Client</button>}
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
        {db.clients.length===0 && <div className="col-span-full text-center text-slate-500 py-14 text-sm glass rounded-2xl">No clients yet — add your first one.</div>}
        {db.clients.map(c=>{
          const projects = db.projects.filter(p=>p.clientId===c.id);
          const allTasks = projects.flatMap(p=> tasksByProject[p.id]||[]);
          const done = allTasks.filter(t=>t.status==='Completed').length;
          const pct = allTasks.length? Math.round(done/allTasks.length*100):0;
          return (
            <div key={c.id} className="glass glass-hover rounded-2xl p-6 group">
              <div className="flex items-start justify-between">
                <div className="flex items-center gap-3">
                  <div className="w-11 h-11 rounded-xl grid place-items-center bg-brand-600/10 dark:bg-brand-600/20 text-brand-700 dark:text-brand-300"><Icon name="briefcase" className="w-5 h-5"/></div>
                  <div>
                    <div className="font-bold text-fg text-lg leading-tight">{c.company}</div>
                    <div className="text-xs text-slate-500">{c.primaryContact}</div>
                  </div>
                </div>
                {isAdmin && <button onClick={()=>delClient(c.id)} className="opacity-0 group-hover:opacity-100 text-slate-600 hover:text-rose-400 transition"><Icon name="trash" className="w-4 h-4"/></button>}
              </div>

              <div className="grid grid-cols-3 gap-3 mt-5">
                <Stat label="Projects" value={projects.length} />
                <Stat label="Tasks" value={allTasks.length} />
                <Stat label="Done" value={pct+'%'} />
              </div>

              <div className="mt-4">
                <div className="h-2 rounded-full bg-ink-700 overflow-hidden"><div className="h-full bg-gradient-to-r from-emerald-500 to-teal-400" style={{width:pct+'%'}}></div></div>
              </div>

              <div className="mt-4">
                <div className="flex items-center justify-between mb-2">
                  <span className="text-[11px] uppercase tracking-wider text-slate-500 font-semibold">Projects</span>
                  {isAdmin && <button onClick={()=>setProjModal({ clientId:c.id })} className="text-[11px] font-semibold text-brand-400 hover:text-brand-300 flex items-center gap-1"><Icon name="plus" className="w-3 h-3"/>Add project</button>}
                </div>
                <div className="space-y-1.5">
                  {projects.length===0 && <div className="text-xs text-slate-600 italic">No projects yet</div>}
                  {projects.map(p=>{
                    const pt = tasksByProject[p.id]||[];
                    const pdone = pt.filter(t=>t.status==='Completed').length;
                    const pm = empById[p.managerId], pc = empById[p.checkerId];
                    return (
                      <div key={p.id} className="rounded-lg bg-ink-800/50 border border-hair/5 px-3 py-2 group/proj">
                        <div className="flex items-center gap-2">
                          <Icon name="folder" className="w-3.5 h-3.5 text-brand-300 shrink-0"/>
                          <span className="text-sm font-semibold text-fg truncate flex-1">{p.name}</span>
                          <span className="text-[10px] text-slate-500 whitespace-nowrap">{pdone}/{pt.length} done</span>
                          <Chip className={projStatusChip(p.status)}>{p.status}</Chip>
                          {isAdmin && <button onClick={()=>setProjModal(p)} className="opacity-0 group-hover/proj:opacity-100 text-slate-500 hover:text-brand-300 transition" title="Edit project"><Icon name="pencil" className="w-3.5 h-3.5"/></button>}
                          {isAdmin && <button onClick={()=>delProject(p.id)} className="opacity-0 group-hover/proj:opacity-100 text-slate-500 hover:text-rose-400 transition" title="Delete project"><Icon name="trash" className="w-3.5 h-3.5"/></button>}
                        </div>
                        {(pm||pc) && (
                          <div className="flex items-center gap-4 mt-1.5 pl-5 text-[11px]">
                            {pm && <span className="flex items-center gap-1.5"><span className="text-slate-500">PM</span><Avatar emp={pm} size="w-4 h-4 !text-[7px] !rounded-md"/><span className="text-slate-300 truncate max-w-[110px]">{pm.name}</span></span>}
                            {pc && <span className="flex items-center gap-1.5"><span className="text-slate-500">Checker</span><Avatar emp={pc} size="w-4 h-4 !text-[7px] !rounded-md"/><span className="text-slate-300 truncate max-w-[110px]">{pc.name}</span></span>}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          );
        })}
      </div>

      {showAddClient && <ClientModal refresh={refresh} onClose={()=>setShowAddClient(false)} />}
      {projModal && <ProjectModal db={db} refresh={refresh} clientId={projModal.clientId} project={projModal.id ? projModal : null} onClose={()=>setProjModal(null)} />}
    </div>
  );
}

function ProjectModal({ db, refresh, clientId, project, onClose }){
  const editing = !!project;
  const [name, setName] = useState(project?.name || '');
  const [description, setDescription] = useState(project?.description || '');
  const [status, setStatus] = useState(project?.status || 'Active');
  const [managerId, setManagerId] = useState(project?.managerId || '');
  const [checkerId, setCheckerId] = useState(project?.checkerId || '');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  const client = db.clients.find(c=>c.id===clientId);
  const submit = async () => {
    if(!name.trim()) return setErr('Project name is required.');
    setBusy(true);
    const payload = { name:name.trim(), description, status, managerId:managerId||null, checkerId:checkerId||null };
    const { error } = editing
      ? await store.updateProject(project.id, payload)
      : await store.addProject({ clientId, ...payload });
    setBusy(false);
    if(error) return setErr(error.message);
    refresh(); onClose();
  };
  return (
    <Modal title={editing?'Edit Project':'New Project'} subtitle={client?('For '+client.company):''} onClose={onClose}>
      <div className="space-y-4">
        <Field label="Project name"><input className="zi" value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. Loyalty App Revamp" autoFocus/></Field>
        <Field label="Description (optional)"><input className="zi" value={description} onChange={e=>setDescription(e.target.value)} placeholder="Short summary"/></Field>
        <div className="grid grid-cols-2 gap-4">
          <Field label="Project manager">
            <select className="zi" value={managerId} onChange={e=>setManagerId(e.target.value)}>
              <option value="">— None —</option>
              {db.employees.map(e=><option key={e.id} value={e.id}>{e.name} · {e.designation}</option>)}
            </select>
          </Field>
          <Field label="Checker">
            <select className="zi" value={checkerId} onChange={e=>setCheckerId(e.target.value)}>
              <option value="">— None —</option>
              {db.employees.map(e=><option key={e.id} value={e.id}>{e.name} · {e.designation}</option>)}
            </select>
          </Field>
        </div>
        <Field label="Status"><select className="zi" value={status} onChange={e=>setStatus(e.target.value)}>{PROJECT_STATUSES.map(s=><option key={s}>{s}</option>)}</select></Field>
        {err && <p className="text-rose-400 text-xs font-semibold">{err}</p>}
        <div className="flex gap-3 pt-1">
          <button onClick={onClose} className="flex-1 py-2.5 rounded-lg border border-hair/10 text-slate-300 font-semibold text-sm hover:bg-hair/5">Cancel</button>
          <button onClick={submit} disabled={busy} className="flex-1 py-2.5 rounded-lg bg-brand-600 hover:bg-brand-500 disabled:opacity-60 text-white font-bold text-sm">{busy?'Saving…':(editing?'Save changes':'Add Project')}</button>
        </div>
      </div>
    </Modal>
  );
}

function Stat({ label, value }){
  return <div className="rounded-xl bg-ink-800/60 border border-hair/5 px-3 py-2.5 text-center"><div className="text-xl font-extrabold text-fg tabnum">{value}</div><div className="text-[10px] uppercase tracking-wider text-slate-500 font-semibold">{label}</div></div>;
}

function ClientModal({ refresh, onClose }){
  const [company, setCompany] = useState('');
  const [primaryContact, setPrimaryContact] = useState('');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  const submit = async () => {
    if(!company.trim()) return setErr('Company name is required.');
    setBusy(true);
    const { error } = await store.addClient({ company:company.trim(), primaryContact:primaryContact.trim()||'—' });
    setBusy(false);
    if(error) return setErr(error.message);
    refresh(); onClose();
  };
  return (
    <Modal title="Add Client" subtitle="Register a new client organization" onClose={onClose}>
      <div className="space-y-4">
        <Field label="Company name"><input className="zi" value={company} onChange={e=>setCompany(e.target.value)} placeholder="Acme Corp" autoFocus/></Field>
        <Field label="Primary contact" hint="Name · email"><input className="zi" value={primaryContact} onChange={e=>setPrimaryContact(e.target.value)} placeholder="Jane Doe · jane@acme.com"/></Field>
        {err && <p className="text-rose-400 text-xs font-semibold">{err}</p>}
        <div className="flex gap-3 pt-1">
          <button onClick={onClose} className="flex-1 py-2.5 rounded-lg border border-hair/10 text-slate-300 font-semibold text-sm hover:bg-hair/5">Cancel</button>
          <button onClick={submit} disabled={busy} className="flex-1 py-2.5 rounded-lg bg-brand-600 hover:bg-brand-500 disabled:opacity-60 text-white font-bold text-sm">{busy?'Adding…':'Add Client'}</button>
        </div>
      </div>
    </Modal>
  );
}
